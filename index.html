<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Poll: Do you shuyesh?</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Do you shuyesh?</h1>
        
        <div class="image-container">
            <img src="https://avatars.mds.yandex.net/i?id=ff0f71c176f16639fe3cb4cf8a22b068168721fd-4545333-images-thumbs&n=13" alt="Image for the poll" id="poll-image">
        </div>
        
        <div class="answers">
            <label class="answer-option">
                <input type="radio" name="answer" value="yes">
                Yes, of course!
            </label>
            
            <label class="answer-option">
                <input type="radio" name="answer" value="no">
                No, never!
            </label>
            
            <label class="answer-option">
                <input type="radio" name="answer" value="sometimes">
                Sometimes I shuyesh
            </label>
        </div>
        
        <div class="button-container">
            <button id="next-btn">Next question ></button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
